<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Outer gear/serrated edge -->
  <circle cx="200" cy="200" r="180" fill="#DC2626" stroke="#B91C1C" stroke-width="3"/>

  <!-- Create serrated edge effect -->
  <g fill="#DC2626">
    <path d="M200 25 L205 45 L195 45 Z"/>
    <path d="M200 375 L205 355 L195 355 Z"/>
    <path d="M25 200 L45 195 L45 205 Z"/>
    <path d="M375 200 L355 195 L355 205 Z"/>
  </g>

  <!-- Inner circle background -->
  <circle cx="200" cy="200" r="155" fill="#DC2626"/>

  <!-- INTERPROVINCIAL text at top -->
  <path id="topArc" d="M 80 140 A 120 120 0 0 1 320 140" fill="none"/>
  <text fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle" fill="#1e3a5f">
      INTERPROVINCIAL
    </textPath>
  </text>

  <!-- STANDARD text -->
  <text x="200" y="165" text-anchor="middle" fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="4">
    STANDARD
  </text>

  <!-- CANADA - main text -->
  <text x="200" y="215" text-anchor="middle" fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="48" letter-spacing="3">
    CANADA
  </text>

  <!-- Two horizontal lines -->
  <line x1="120" y1="235" x2="280" y2="235" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="120" y1="245" x2="280" y2="245" stroke="#1e3a5f" stroke-width="3"/>

  <!-- NORME text -->
  <text x="200" y="275" text-anchor="middle" fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="3">
    NORME
  </text>

  <!-- INTERPROVINCIALE text at bottom -->
  <path id="bottomArc" d="M 80 280 A 120 120 0 0 0 320 280" fill="none"/>
  <text fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle" fill="#1e3a5f">
      INTERPROVINCIALE
    </textPath>
  </text>

  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#DC2626" stroke-width="4"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#B91C1C" stroke-width="2"/>
</svg>
